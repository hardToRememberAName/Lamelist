name: Update Filters
on:
  push:
    paths-ignore:
      - 'README.md'
      - '*.md'
    branches: [ main ]
  schedule:
    - cron: 0 0 * * *   # UTC 00:00 = 北京时间 08:00，每天一次
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

# 滚动快照会 force push main，禁止两个任务并发互相覆盖
concurrency:
  group: rolling-snapshot
  cancel-in-progress: false

jobs:
  Update_Filters:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: Run Jar
        run:  java -jar ./target/adg-rule-1.0.0.jar

      # 规则文件是构建产物，每天全量重建。
      # 用 orphan 提交 + force push 让 main 的历史永远是 1 个提交，
      # 仓库体积不再随提交次数线性膨胀（否则旧版本 blob 会累积到 10GB 量级）。
      # 提交信息带 [skip ci]，避免 force push 再次触发本 workflow 造成死循环。
      - name: Rolling snapshot | 滚动提交并覆盖 main
        id: snapshot
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "无变更，跳过"
            exit 0
          fi
          git config --local user.email "mr.rhwang@gmail.com"
          git config --local user.name "hardToRememberAName"
          git checkout --orphan rolling
          git add -A
          git commit -m "Snapshot $(date +'%Y-%m-%d %H:%M:%S') [skip ci]"
          git push --force origin HEAD:refs/heads/main
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Mirror Refresh
        if: steps.snapshot.outputs.status == 'success' && !cancelled()
        run: sleep 10 && curl 'https://purge.jsdelivr.net/gh/${{github.repository}}/rule'

      - name: Delete Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 1
